<div appViewPanel class="order-summary-container">
  <h2 class="summary-title">Order Summary</h2>

  <div class="checkout-items-wrapper">
    <ng-content select="[checkoutItems]"></ng-content>
  </div>

  <div class="summary-totals-section">
    <div class="summary-row">
      <span>Subtotal</span>
      <span>$ {{ subtotal() }}</span>
    </div>

    <div class="summary-row">
      <span>Tax</span>
      <span>$ {{ tax() }}</span>
    </div>

    <div class="summary-row total-row">
      <span>Total</span>
      <span>$ {{ total() }}</span>
    </div>

    <ng-content select="[actionButtons]"></ng-content>
  </div>
</div>
