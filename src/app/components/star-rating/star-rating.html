<div class="star-rating-wrapper">
  <div class="stars-container">
    @for (star of starArray(); track $index) {
      <mat-icon
        class="star-icon"
        [inline]="true"
        [class]="star ? 'star-filled' : 'star-empty'"
      >
      star
      </mat-icon>
    }
  </div>
  <span class="rating-text">
    <ng-content></ng-content>
  </span>
</div>
