<div class="cart-page-container">
  <app-back-button class="back-navigation" navigateTo="/products/all">
    Continue Shopping
  </app-back-button>

  <h1 class="page-title">Shopping Cart</h1>

  <app-tease-wishlist class="wishlist-teaser"></app-tease-wishlist>

  <div class="cart-layout-grid">
    <div class="cart-items-column">
      <app-list-cart-items></app-list-cart-items>
    </div>

    <div class="summary-column">
      <app-summarize-order>
        <ng-container actionButtons>
          <button matButton="filled" class="checkout-button" (click)="store.proceedToCheckout()">
            Proceed to Checkout
          </button>
        </ng-container>
      </app-summarize-order>
    </div>
  </div>
</div>
