<div class="grid grid-cols-3 grid-cols-[3fr_1fr_1fr]">
  <div class="flex items-center gap-4">
    <img [src]="item().product.imageUrl" alt="product-image" class="w-24 h-24 rounded-lg object-cover">
  </div>
  <div>
    <div class="text-gray-900 text-lg font-semibold">{{ item().product.name }}</div>
    <div class="text-gray-600 text-lg">${{ item().product.price }}</div>
  </div>
  <div>
    <app-qty-selector [quantity]="item().quantity" (qtyUpdated)="">
    </app-qty-selector>

    <div class="flex flex-col items-end">
      <div class="text-right font-semibold text-lg">
        ${{ total() }}
      </div>

      <div class="">
        <button matIconButton>
          <mat-icon>favorite_border</mat-icon>
        </button>

      </div>

    </div>

  </div>

</div>
