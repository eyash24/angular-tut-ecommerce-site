@if (inStock()) {
  <div class="stock-indicator in-stock">
    <mat-icon class="status-icon">check_circle</mat-icon>
    <span class="status-text">In stock and ready to ship</span>
  </div>
} @else {
  <div class="stock-indicator out-of-stock danger">
    <mat-icon class="status-icon">warning</mat-icon>
    <span class="status-text">
      This is currently out of stock. Add it to your wishlist to be notified when it's available again.
    </span>
  </div>
}
