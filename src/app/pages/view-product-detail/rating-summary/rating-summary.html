<div class="rating-summary-container">
  <div class="rating-score-box">
    <div class="rating-score">
      {{ store.averageRating() }}
    </div>
    <div class="rating-stars">
      <app-star-rating [rating]="store.averageRating()"></app-star-rating>
    </div>
    <div class="rating-subtitle">Based on {{ totalReviews() }} reviews</div>
  </div>

  <div class="rating-bars-container">
    @for (breakdown of ratingBreakdown(); track breakdown.stars) {
      <div class="rating-bar-row">
        <span class="star-label">{{ breakdown.stars}}⭑</span>
        <div class="bar-track">
          <div
            class="bar-fill"
            [style.width.%]="breakdown.percentage"
          >
          </div>
        </div>
        <span class="count-label">{{ breakdown.count}}</span>
      </div>
    }
  </div>
</div>
