<div class="product-detail-container">
  <app-back-button class="back-navigation" [navigateTo]="backRoute()">
    Continue Shopping
  </app-back-button>

  @if (store.selectedProduct(); as product) {
    <div class="product-layout-wrapper">
      <img [src]="product.image_url" [alt]="product.name" class="product-detail-image"
        [style.view-transition-name]="'product-image-' + product.id"
      >

      <div class="product-info-wrapper">
        <app-product-info [product]="product"></app-product-info>
      </div>
    </div>

    @defer (on hover) {
      <app-view-review></app-view-review>
    } @placeholder (minimum 1s){
      <h2 class="reviews-placeholder-title">Customer Reviews</h2>
    } @loading (minimum 1s; after 200ms) {
      <p class="reviews-placeholder-title">Loading reviews...</p>
    } @error {
      <p class="reviews-placeholder-title">Failed to load reviews</p>
    }
  }
</div>
