<div appViewPanel class="write-review-container">
  <h2 class="form-title">Write a Review</h2>
  <form [formGroup]="reviewForm" (ngSubmit)="saveReview()" class="review-form">
    <div class="form-grid">
      <mat-form-field>
        <mat-label>Review Title</mat-label>
        <input
          type="text"
          formControlName="title"
          matInput
          placeholder="Summarise your review"
        />
      </mat-form-field>

      <mat-form-field>
        <mat-select formControlName="rating" placeholder="Select rating">
          @for (option of ratingOptions(); track option.value){
            <mat-option [value]="option.value">{{ option.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field class="full-width-field">
        <mat-label>Review</mat-label>
        <textarea
          placeholder="Tell others about your experience with this product"
          formControlName="comment"
          matInput
          rows="4"
         ></textarea>
      </mat-form-field>
    </div>

    <div class="form-actions">
      <button matButton="filled" type="submit" [disabled]="store.loading()">
        {{ store.loading() ? 'Submitting...' : 'Submit Review'}}
      </button>
      <button matButton="outlined" type="button" (click)="store.hideWriteReview()">
        Cancel
      </button>
    </div>
  </form>
</div>
