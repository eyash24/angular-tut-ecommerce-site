<div class="checkout-container">
  <app-back-button class="back-button" navigateTo="/cart">
    Back to Cart
  </app-back-button>
  <h1 class="checkout-title">Checkout</h1>

  <div class="checkout-grid">
    <div class="forms-column">
       <app-shipping-form></app-shipping-form>
       <app-payment-form></app-payment-form>
    </div>
    <div class="summary-column">
      <app-summarize-order>

        <ng-container checkoutItems>
          @for (item of store.cartItems(); track item.product.id) {
            <div class="checkout-item-row">
              <span>{{ item.product.name}} x {{ item.quantity }}</span>
              <span>${{ (item.product.price * item.quantity).toFixed(0) }}</span>
            </div>
          }
        </ng-container>

        <ng-container actionButtons>
          <button
            matButton="filled"
            class="place-order-button"
            [disabled]="store.loading()"
            (click)="store.placeOrder()"
          >
            {{ store.loading() ? 'Processing...' : 'Place Order'}}
          </button>
        </ng-container>
      </app-summarize-order>

    </div>

  </div>
</div>
