<div appViewPanel class="shipping-info-container">
   <h2 class="shipping-title">
    <mat-icon>local_shipping</mat-icon>
    Shipping Information
   </h2>

   <form class="shipping-form">
    <mat-form-field>
      <input type="text" placeholder="First Name" matInput />
    </mat-form-field>

    <mat-form-field>
      <input type="text" placeholder="Last Name" matInput />
    </mat-form-field>

    <mat-form-field class="full-width-field">
      <textarea type="text" placeholder="Address" matInput></textarea>
    </mat-form-field>

    <mat-form-field>
      <input type="text" placeholder="City" matInput />
    </mat-form-field>

    <mat-form-field>
      <input type="text" placeholder="State" matInput />
    </mat-form-field>

    <mat-form-field>
      <input type="text" placeholder="Zip" matInput />
    </mat-form-field>
   </form>
</div>
